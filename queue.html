<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Submission Queue | HAKYHM</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
  <style>
    .q-wrap{max-width:980px;margin:0 auto;padding:60px 20px 100px}
    .q-top{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:26px}
    .q-top h1{font-family:Anton,sans-serif;font-size:clamp(44px,8vw,80px);margin:0;letter-spacing:1px;font-weight:400}
    .q-login{max-width:380px;margin:80px auto;background:#0a0a0a;border:1px solid rgba(255,255,255,.08);padding:30px;display:grid;gap:14px}
    .q-login h1{font-family:Anton,sans-serif;font-weight:400;margin:0 0 6px}
    .q-login input{background:#050505;border:1px solid rgba(255,255,255,.12);color:#f2eded;padding:14px;font:inherit}
    .q-btn{background:#ece9e7;color:#111;border:0;padding:12px 16px;font-family:Anton,sans-serif;letter-spacing:1px;cursor:pointer;font-size:12px}
    .q-btn.red{background:#a40000;color:#fff}.q-btn.ghost{background:transparent;color:#ddd;border:1px solid rgba(255,255,255,.2)}
    .q-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
    .q-tabs button{background:#0a0a0a;border:1px solid #292020;color:#aaa1a1;padding:11px 16px;font:800 10px Montserrat,sans-serif;letter-spacing:2px;cursor:pointer}
    .q-tabs button.active{background:rgba(164,0,0,.16);border-color:#a40000;color:#fff}
    .q-item{background:#0a0a0a;border:1px solid rgba(255,255,255,.07);border-left:3px solid #a40000;padding:20px;margin-bottom:12px;display:grid;gap:10px}
    .q-item h3{margin:0;font-size:20px;font-weight:600}
    .q-meta{color:#a9a1a1;font-size:12px;line-height:1.7}
    .q-meta a{color:#e8dddd}
    .q-msg{color:#cfc8c8;font-size:13px;line-height:1.6;white-space:pre-wrap}
    .q-actions{display:flex;gap:8px;flex-wrap:wrap}
    .q-empty,.q-err{color:#a9a1a1;text-align:center;padding:40px 0}.q-err{color:#ff6b6b}
  </style>
</head>
<body>
  <main class="q-wrap" id="app"></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script src="./queue.js"></script>
</body>
</html>
